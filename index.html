<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fighter Jet Dogfight Simulation // John Boyd OODA</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles/main.css">
  <script defer src="src/theme/boot.js"></script>
  <script defer src="src/theme/colors.js"></script>
  <script defer src="src/life.js"></script>
  <script defer src="src/dogfight/pools.js"></script>
  <script defer src="src/dogfight/specs.js"></script>
  <script defer src="src/dogfight/state.js"></script>
  <script defer src="src/dogfight/alt.js"></script>
  <script defer src="src/dogfight/ooda-obs.js"></script>
  <script defer src="src/dogfight/ooda-engage.js"></script>
  <script defer src="src/dogfight/ooda-decide.js"></script>
  <script defer src="src/dogfight/vfx-spawn.js"></script>
  <script defer src="src/dogfight/vfx-wreck.js"></script>
  <script defer src="src/dogfight/vfx-part.js"></script>
  <script defer src="src/dogfight/damage.js"></script>
  <script defer src="src/dogfight/draw-health.js"></script>
  <script defer src="src/dogfight/draw-jet.js"></script>
  <script defer src="src/dogfight/draw-jet-low.js"></script>
  <script defer src="src/dogfight/draw-jet-high.js"></script>
  <script defer src="src/dogfight/jets-on.js"></script>
  <script defer src="src/dogfight/create.js"></script>
  <script defer src="src/dogfight/sync.js"></script>
  <script defer src="src/dogfight/physics-turn.js"></script>
  <script defer src="src/dogfight/physics-swarm.js"></script>
  <script defer src="src/dogfight/physics-b.js"></script>
  <script defer src="src/dogfight/physics-a.js"></script>
  <script defer src="src/dogfight/cca.js"></script>
  <script defer src="src/dogfight/tactics.js"></script>
  <script defer src="src/dogfight/weapons-lo.js"></script>
  <script defer src="src/dogfight/weapons-hi.js"></script>
  <script defer src="src/dogfight/loop-sim.js"></script>
  <script defer src="src/dogfight/loop-draw.js"></script>
  <script defer src="src/dogfight/loop-bullets.js"></script>
  <script defer src="src/dogfight/loop-missiles.js"></script>
  <script defer src="src/dogfight/loop-fx.js"></script>
  <script defer src="src/dogfight/loop-proj.js"></script>
  <script defer src="src/dogfight/loop.js"></script>
  <script defer src="src/dogfight/init.js"></script>
  <script defer src="src/sky/starfield.js"></script>
  <script defer src="src/theme/cycle.js"></script>
</head>
<body>
  <canvas id="dogfight-canvas"></canvas>

  <div class="hud-overlay">
    <header class="hud-header hud-interactive">
      <div class="hud-title-group">
        <span class="hud-sigil">&gt;&gt;</span>
        <span class="hud-title">BOYD OODA // FIGHTER JET DOGFIGHT SIMULATOR</span>
        <span class="hud-formula">E-M = ((T - D) / W) * V</span>
      </div>

      <!-- Generation Selector -->
      <div class="gen-bar" id="gen-bar" aria-label="Toggle fighter generations">
        <span class="gen-title">GEN:</span>
        <button type="button" class="gen-btn" data-gen="1" title="Gen 1 (F-86 Sabre)">1</button>
        <button type="button" class="gen-btn" data-gen="2" title="Gen 2 (F-4 Phantom)">2</button>
        <button type="button" class="gen-btn" data-gen="3" title="Gen 3 (F-15 Eagle)">3</button>
        <button type="button" class="gen-btn active" data-gen="4" title="Gen 4 (F-16 Falcon)">4</button>
        <button type="button" class="gen-btn" data-gen="5" title="Gen 5 (F-22 Raptor)">5</button>
        <button type="button" class="gen-btn" data-gen="6" title="Gen 6 (NGAD)">6</button>
        <button type="button" class="gen-btn" data-gen="7" title="Gen 7 (AI Swarm)">7</button>
      </div>

      <div class="hud-actions">
        <button class="hud-btn hud-btn-blue" onclick="scrambleWave('blue', 4)">[ SCRAMBLE BLUE ]</button>
        <button class="hud-btn hud-btn-red" onclick="scrambleWave('red', 4)">[ SCRAMBLE RED ]</button>
      </div>
    </header>

    <footer class="hud-footer">
      <div class="hud-radio-box hud-interactive">
        <div class="radio-header">
          <span>&gt; TAC-NET RADIO CHATTER</span>
          <span id="radio-time">LIVE</span>
        </div>
        <div class="radio-stream" id="radio-log">
          [TAC-NET] Combat Air Patrol established. Airspace active.
        </div>
      </div>

      <div class="hud-specs-box hud-interactive">
        <div class="spec-item">ENGINE: <strong>HTML5 CANVAS / 60 FPS</strong></div>
        <div class="spec-item">ALLOCATOR: <strong>ZERO-GC TYPED ARRAYS</strong></div>
        <div class="spec-item">PHYSICS: <strong>BOYD E-M &amp; PRO-NAV</strong></div>
      </div>
    </footer>
  </div>

  <script defer>
    window.addEventListener('load', () => {
      jetsEnabled = true;
      if (!hasAnyActiveGen()) activeGens[4] = true;
      setupGenSelector();
      initGlobalDogfight();

      // Hook dfRadio chatter to display in HUD radio box
      const radioLog = document.getElementById('radio-log');
      const origDfRadio = window.dfRadio;
      window.dfRadio = function(msg) {
        if (origDfRadio) origDfRadio(msg);
        if (radioLog) {
          const line = document.createElement('div');
          line.textContent = '> ' + msg;
          radioLog.prepend(line);
          while (radioLog.children.length > 6) {
            radioLog.removeChild(radioLog.lastChild);
          }
        }
      };
    });
  </script>
</body>
</html>
