<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Air, Sea & Sub-Surface Battlespace // Boyd OODA Simulation</title>
  <meta name="description" content="Multi-domain warfighting simulation across 7 generations of combat aircraft, naval surface strike groups, and sub-surface bathymetry based on Col. John Boyd's Energy-Maneuverability Theory and OODA Loop.">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles/main.css">

  <!-- Core Theme & Simulation Engine Scripts -->
  <script defer src="src/theme/boot.js"></script>
  <script defer src="src/theme/colors.js"></script>
  <script defer src="src/life.js"></script>
  <script defer src="src/dogfight/pools.js"></script>
  <script defer src="src/dogfight/specs.js"></script>
  <script defer src="src/dogfight/state.js"></script>
  <script defer src="src/dogfight/alt.js"></script>
  <script defer src="src/dogfight/ooda-obs.js"></script>
  <script defer src="src/dogfight/ooda-engage.js"></script>
  <script defer src="src/dogfight/ooda-decide.js"></script>
  <script defer src="src/dogfight/vfx-spawn.js"></script>
  <script defer src="src/dogfight/vfx-wreck.js"></script>
  <script defer src="src/dogfight/vfx-part.js"></script>
  <script defer src="src/dogfight/damage.js"></script>
  <script defer src="src/dogfight/draw-health.js"></script>
  <script defer src="src/dogfight/draw-jet.js"></script>
  <script defer src="src/dogfight/draw-jet-low.js"></script>
  <script defer src="src/dogfight/draw-jet-high.js"></script>
  <script defer src="src/dogfight/jets-on.js"></script>
  <script defer src="src/dogfight/create.js"></script>
  <script defer src="src/dogfight/sync.js"></script>
  <script defer src="src/dogfight/physics-turn.js"></script>
  <script defer src="src/dogfight/physics-swarm.js"></script>
  <script defer src="src/dogfight/physics-b.js"></script>
  <script defer src="src/dogfight/physics-a.js"></script>
  <script defer src="src/dogfight/cca.js"></script>
  <script defer src="src/dogfight/tactics.js"></script>
  <script defer src="src/dogfight/weapons-lo.js"></script>
  <script defer src="src/dogfight/weapons-hi.js"></script>
  <script defer src="src/dogfight/loop-sim.js"></script>
  <script defer src="src/dogfight/loop-draw.js"></script>
  <script defer src="src/dogfight/loop-bullets.js"></script>
  <script defer src="src/dogfight/loop-missiles.js"></script>
  <script defer src="src/dogfight/loop-fx.js"></script>
  <script defer src="src/dogfight/loop-proj.js"></script>
  <script defer src="src/dogfight/landscape.js"></script>
  <script defer src="src/dogfight/audio.js"></script>
  <script defer src="src/dogfight/camera.js"></script>
  <script defer src="src/dogfight/combat-meter.js"></script>
  <script defer src="src/dogfight/interactive.js"></script>
  <script defer src="src/dogfight/loop.js"></script>
  <script defer src="src/dogfight/init.js"></script>
  <script defer src="src/sky/starfield.js"></script>
  <script defer src="src/theme/cycle.js"></script>
</head>
<body>
  <!-- Simulation Canvas -->
  <canvas id="dogfight-canvas"></canvas>

  <!-- Tactical HUD Overlay (Only Blue and Red Force Boxes in Header) -->
  <div class="hud-overlay">
    <header class="hud-header">
      <!-- Blue Allied Force Box (Left) -->
      <div class="hud-force-box force-blue hud-interactive" id="force-blue">
        <div class="force-header">
          <div class="force-title-group">
            <span class="team-beacon beacon-blue"></span>
            <span class="force-title">BLUE ALLIED FORCE</span>
          </div>
          <div class="force-stats">
            <span class="stat-item"><span class="stat-lbl">SORTIES:</span> <span class="stat-val stat-val-cyan" id="stat-blue-sorties">1 ACTIVE</span></span>
            <span class="stat-item"><span class="stat-lbl">KILLS:</span> <span class="stat-val stat-val-cyan" id="stat-blue-kills">0 SPLASHES</span></span>
            <span class="stat-item"><span class="stat-lbl">ACES:</span> <span class="stat-val stat-val-gold" id="stat-blue-aces">0 ACES</span></span>
          </div>
        </div>
        <div class="force-controls">
          <div class="gen-bar gen-bar-blue" id="gen-bar-blue">
            <button type="button" class="gen-btn gen-btn-blue" data-team="blue" data-gen="1" title="Blue Gen 1 (F-86 Sabre)"><span class="g-num">1</span><span class="g-name">SABRE</span></button>
            <button type="button" class="gen-btn gen-btn-blue" data-team="blue" data-gen="2" title="Blue Gen 2 (F-4 Phantom)"><span class="g-num">2</span><span class="g-name">PHANTOM</span></button>
            <button type="button" class="gen-btn gen-btn-blue" data-team="blue" data-gen="3" title="Blue Gen 3 (F-14 Tomcat)"><span class="g-num">3</span><span class="g-name">TOMCAT</span></button>
            <button type="button" class="gen-btn gen-btn-blue active" data-team="blue" data-gen="4" title="Blue Gen 4 (F-16 Viper)"><span class="g-num">4</span><span class="g-name">VIPER</span></button>
            <button type="button" class="gen-btn gen-btn-blue" data-team="blue" data-gen="5" title="Blue Gen 5 (F-22 Raptor)"><span class="g-num">5</span><span class="g-name">RAPTOR</span></button>
            <button type="button" class="gen-btn gen-btn-blue" data-team="blue" data-gen="6" title="Blue Gen 6 (NGAD + CCA)"><span class="g-num">6</span><span class="g-name">NGAD</span></button>
            <button type="button" class="gen-btn gen-btn-blue" data-team="blue" data-gen="7" title="Blue Gen 7 (Quantum Swarm)"><span class="g-num">7</span><span class="g-name">SWARM</span></button>
          </div>
          <button type="button" class="hud-btn hud-btn-blue force-scramble-btn" onclick="scrambleWave('blue')" title="Scramble Blue Allied Flight">[ + SCRAMBLE ]</button>
        </div>
      </div>

      <!-- Red Opposing Force Box (Right) -->
      <div class="hud-force-box force-red hud-interactive" id="force-red">
        <div class="force-header">
          <div class="force-title-group">
            <span class="team-beacon beacon-red"></span>
            <span class="force-title">RED OPPOSING FORCE</span>
          </div>
          <div class="force-stats">
            <span class="stat-item"><span class="stat-lbl">BANDITS:</span> <span class="stat-val stat-val-red" id="stat-red-sorties">1 ACTIVE</span></span>
            <span class="stat-item"><span class="stat-lbl">KILLS:</span> <span class="stat-val stat-val-red" id="stat-red-kills">0 SPLASHES</span></span>
            <span class="stat-item"><span class="stat-lbl">ACES:</span> <span class="stat-val stat-val-gold" id="stat-red-aces">0 ACES</span></span>
          </div>
        </div>
        <div class="force-controls">
          <div class="gen-bar gen-bar-red" id="gen-bar-red">
            <button type="button" class="gen-btn gen-btn-red" data-team="red" data-gen="1" title="Red Gen 1 (MiG-15 Fagot)"><span class="g-num">1</span><span class="g-name">MiG-15</span></button>
            <button type="button" class="gen-btn gen-btn-red" data-team="red" data-gen="2" title="Red Gen 2 (MiG-21 Fishbed)"><span class="g-num">2</span><span class="g-name">MiG-21</span></button>
            <button type="button" class="gen-btn gen-btn-red" data-team="red" data-gen="3" title="Red Gen 3 (MiG-23)"><span class="g-num">3</span><span class="g-name">MiG-23</span></button>
            <button type="button" class="gen-btn gen-btn-red active" data-team="red" data-gen="4" title="Red Gen 4 (Su-27 Flanker)"><span class="g-num">4</span><span class="g-name">FLANKER</span></button>
            <button type="button" class="gen-btn gen-btn-red" data-team="red" data-gen="5" title="Red Gen 5 (Su-57 Felon)"><span class="g-num">5</span><span class="g-name">FELON</span></button>
            <button type="button" class="gen-btn gen-btn-red" data-team="red" data-gen="6" title="Red Gen 6 (Hostile CCA)"><span class="g-num">6</span><span class="g-name">CCA RED</span></button>
            <button type="button" class="gen-btn gen-btn-red" data-team="red" data-gen="7" title="Red Gen 7 (Hostile Swarm)"><span class="g-num">7</span><span class="g-name">SWARM</span></button>
          </div>
          <button type="button" class="hud-btn hud-btn-red force-scramble-btn" onclick="scrambleWave('red')" title="Scramble Red Hostile Flight">[ + SCRAMBLE ]</button>
        </div>
      </div>
    </header>
  </div>

  <!-- Tactical Application Lifecycle Logic -->
  <script defer>
    window.addEventListener('load', function () {
      jetsEnabled = true;
      if (!hasAnyActiveGen()) activeGens[4] = true;
      setupGenSelector();
      initGlobalDogfight();

      if (window.InteractiveController) {
        InteractiveController.init();
      }
    });
  </script>
</body>
</html>
