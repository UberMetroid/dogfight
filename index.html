<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Air & Sea Battlespace // West vs East // 6-Generation Fighter Dogfight</title>
  <meta name="description" content="West vs East fighter jet dogfight simulation across 6 generations of combat aircraft, based on Col. John Boyd's Energy-Maneuverability Theory and OODA Loop. Realistic physics, radar, missiles, guns, weather, and day/night rotation.">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles/main.css?v=3.0">

  <!-- Core Theme & Simulation Engine Scripts -->
  <script defer src="src/theme/boot.js?v=3.0"></script>
  <script defer src="src/theme/colors.js?v=3.0"></script>
  <script defer src="src/life.js?v=3.0"></script>
  <script defer src="src/dogfight/pools.js?v=3.0"></script>
  <script defer src="src/dogfight/specs.js?v=3.0"></script>
  <script defer src="src/dogfight/state.js?v=3.0"></script>
  <script defer src="src/dogfight/alt.js?v=3.0"></script>
  <script defer src="src/dogfight/ooda-obs.js?v=3.0"></script>
  <script defer src="src/dogfight/ooda-engage.js?v=3.0"></script>
  <script defer src="src/dogfight/ooda-decide.js?v=3.0"></script>
  <script defer src="src/dogfight/vfx-spawn.js?v=3.0"></script>
  <script defer src="src/dogfight/vfx-wreck.js?v=3.0"></script>
  <script defer src="src/dogfight/vfx-part.js?v=3.0"></script>
  <script defer src="src/dogfight/damage.js?v=3.0"></script>
  <script defer src="src/dogfight/draw-health.js?v=3.0"></script>
  <script defer src="src/dogfight/draw-jet.js?v=3.0"></script>
  <script defer src="src/dogfight/draw-jet-low.js?v=3.0"></script>
  <script defer src="src/dogfight/draw-jet-high.js?v=3.0"></script>
  <script defer src="src/dogfight/jets-on.js?v=3.0"></script>
  <script defer src="src/dogfight/create.js?v=3.0"></script>
  <script defer src="src/dogfight/sync.js?v=3.0"></script>
  <script defer src="src/dogfight/physics-turn.js?v=3.0"></script>
  <script defer src="src/dogfight/ace-employment.js?v=3.0"></script>
  <script defer src="src/dogfight/physics-b.js?v=3.0"></script>
  <script defer src="src/dogfight/physics-a.js?v=3.0"></script>
  <script defer src="src/dogfight/physics-swarm.js?v=3.0"></script>
  <script defer src="src/dogfight/cca.js?v=3.0"></script>
  <script defer src="src/dogfight/tactics.js?v=3.0"></script>
  <script defer src="src/dogfight/weapons-lo.js?v=3.0"></script>
  <script defer src="src/dogfight/weapons-hi.js?v=3.0"></script>
  <script defer src="src/dogfight/campaign.js?v=3.0"></script>
  <script defer src="src/dogfight/landscape.js?v=3.0"></script>
  <script defer src="src/dogfight/audio.js?v=3.0"></script>
  <script defer src="src/dogfight/camera.js?v=3.0"></script>
  <script defer src="src/dogfight/combat-meter.js?v=3.0"></script>
  <script defer src="src/dogfight/interactive.js?v=3.0"></script>
  <script defer src="src/dogfight/loop.js?v=3.0"></script>
  <script defer src="src/dogfight/loop-draw.js?v=3.0"></script>
  <script defer src="src/dogfight/loop-bullets.js?v=3.0"></script>
  <script defer src="src/dogfight/loop-missiles.js?v=3.0"></script>
  <script defer src="src/dogfight/loop-fx.js?v=3.0"></script>
  <script defer src="src/dogfight/loop-proj.js?v=3.0"></script>
  <script defer src="src/dogfight/init.js?v=3.0"></script>
  <script defer src="src/sky/starfield.js?v=3.0"></script>
  <script defer src="src/theme/cycle.js?v=3.0"></script>
</head>
<body>
  <!-- Simulation Canvas -->
  <canvas id="dogfight-canvas"></canvas>

  <!-- Tactical HUD Overlay (West and East Force Boxes with Center Campaign Era Badge) -->
  <div class="hud-overlay">
    <header class="hud-header">
      <!-- West Allied Force Box (Left) -->
      <div class="hud-force-box force-west hud-interactive" id="force-west">
        <div class="force-header">
          <div class="force-title-group">
            <div class="title-left">
              <span class="team-beacon beacon-west"></span>
              <span class="force-title">WEST ALLIED FORCE</span>
            </div>
            <span class="force-element-badge badge-west" id="stat-west-element">SABRE 1-1 & 1-2</span>
          </div>
          <div class="force-stats">
            <span class="stat-item"><span class="stat-lbl">SORTIES:</span> <span class="stat-val stat-val-cyan" id="stat-west-sorties">2 ACTIVE</span></span>
            <span class="stat-item"><span class="stat-lbl">FUEL:</span> <span class="stat-val stat-val-cyan" id="stat-west-fuel">100%</span></span>
            <span class="stat-item"><span class="stat-lbl">KILLS:</span> <span class="stat-val stat-val-cyan" id="stat-west-kills">0 SPLASHES</span></span>
            <span class="stat-item"><span class="stat-lbl">ACES:</span> <span class="stat-val stat-val-gold" id="stat-west-aces">0 ACES</span></span>
          </div>
        </div>
        <div class="force-controls">
          <div class="gen-bar gen-bar-west" id="gen-bar-west">
            <button type="button" class="gen-btn gen-btn-west" data-team="west" data-gen="1" title="West Gen 1 (F-86 Sabre)"><span class="g-num">1</span><span class="g-name">SABRE</span></button>
            <button type="button" class="gen-btn gen-btn-west" data-team="west" data-gen="2" title="West Gen 2 (F-4 Phantom / F-104)"><span class="g-num">2</span><span class="g-name">PHANTOM</span></button>
            <button type="button" class="gen-btn gen-btn-west" data-team="west" data-gen="3" title="West Gen 3 (F-4 Phantom II)"><span class="g-num">3</span><span class="g-name">PHANTOM</span></button>
            <button type="button" class="gen-btn gen-btn-west active" data-team="west" data-gen="4" title="West Gen 4 (F-14 / F-15 / F-16 / F/A-18)"><span class="g-num">4</span><span class="g-name">VIPER</span></button>
            <button type="button" class="gen-btn gen-btn-west" data-team="west" data-gen="5" title="West Gen 5 (F-22 Raptor / F-35)"><span class="g-num">5</span><span class="g-name">RAPTOR</span></button>
            <button type="button" class="gen-btn gen-btn-west" data-team="west" data-gen="6" title="West Gen 6 (NGAD)"><span class="g-num">6</span><span class="g-name">NGAD</span></button>
            <button type="button" class="gen-btn gen-btn-west" data-team="west" data-gen="7" title="West Gen 7 (CCA SWARM ALPHA)"><span class="g-num">7</span><span class="g-name">SWARM</span></button>
          </div>
        </div>
      </div>

      <!-- East Opposing Force Box (Right) -->
      <div class="hud-force-box force-east hud-interactive" id="force-east">
        <div class="force-header">
          <div class="force-title-group">
            <div class="title-left">
              <span class="team-beacon beacon-east"></span>
              <span class="force-title">EAST OPPOSING FORCE</span>
            </div>
            <span class="force-element-badge badge-east" id="stat-east-element">MiG-15 1-1 & 1-2</span>
          </div>
          <div class="force-stats">
            <span class="stat-item"><span class="stat-lbl">BANDITS:</span> <span class="stat-val stat-val-red" id="stat-east-sorties">2 ACTIVE</span></span>
            <span class="stat-item"><span class="stat-lbl">FUEL:</span> <span class="stat-val stat-val-red" id="stat-east-fuel">100%</span></span>
            <span class="stat-item"><span class="stat-lbl">KILLS:</span> <span class="stat-val stat-val-red" id="stat-east-kills">0 SPLASHES</span></span>
            <span class="stat-item"><span class="stat-lbl">ACES:</span> <span class="stat-val stat-val-gold" id="stat-east-aces">0 ACES</span></span>
          </div>
        </div>
        <div class="force-controls">
          <div class="gen-bar gen-bar-east" id="gen-bar-east">
            <button type="button" class="gen-btn gen-btn-east" data-team="east" data-gen="1" title="East Gen 1 (MiG-15 / MiG-17)"><span class="g-num">1</span><span class="g-name">MiG-15</span></button>
            <button type="button" class="gen-btn gen-btn-east" data-team="east" data-gen="2" title="East Gen 2 (MiG-19 / MiG-21 / Su-7)"><span class="g-num">2</span><span class="g-name">MiG-21</span></button>
            <button type="button" class="gen-btn gen-btn-east" data-team="east" data-gen="3" title="East Gen 3 (MiG-21 / MiG-23 / MiG-25)"><span class="g-num">3</span><span class="g-name">MiG-23</span></button>
            <button type="button" class="gen-btn gen-btn-east active" data-team="east" data-gen="4" title="East Gen 4 (Su-27 / MiG-29 / MiG-31)"><span class="g-num">4</span><span class="g-name">FLANKER</span></button>
            <button type="button" class="gen-btn gen-btn-east" data-team="east" data-gen="5" title="East Gen 5 (Su-57 Felon)"><span class="g-num">5</span><span class="g-name">FELON</span></button>
            <button type="button" class="gen-btn gen-btn-east" data-team="east" data-gen="6" title="East Gen 6 (Su-57M)"><span class="g-num">6</span><span class="g-name">FELON-M</span></button>
            <button type="button" class="gen-btn gen-btn-east" data-team="east" data-gen="7" title="East Gen 7 (CCA SWARM CHARLIE)"><span class="g-num">7</span><span class="g-name">SWARM</span></button>
          </div>
        </div>
      </div>
    </header>
  </div>

  <!-- Tactical Application Lifecycle Logic -->
  <script defer>
    window.addEventListener('load', function () {
      jetsEnabled = true;
      if (!hasAnyActiveGen()) activeGens[1] = true;
      setupGenSelector();
      initGlobalDogfight();

      if (window.GenerationalCampaign) {
        GenerationalCampaign.init();
      }

      if (window.InteractiveController) {
        InteractiveController.init();
      }
    });
  </script>
</body>
</html>
